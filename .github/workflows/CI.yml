name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default: no job here needs to write to the repository.
permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — compile + test (Scala / sbt)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install sbt
        uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          apps: sbt

      # Cache the sbt launcher, dependencies, and compiled classes.
      # The cache key includes build.sbt so it invalidates on dependency changes.
      - name: Cache sbt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('deepstone-backend/build.sbt', 'deepstone-backend/project/*.sbt') }}
          restore-keys: sbt-

      - name: Run tests
        working-directory: deepstone-backend
        run: sbt test

      # Generate a coverage report in XML format for SonarCloud.
      # Requires the sbt-scoverage plugin (added below) — skip if not needed.
      - name: Generate coverage report
        working-directory: deepstone-backend
        run: sbt coverage test coverageReport
        continue-on-error: true  # Don't fail CI if coverage reporting breaks

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: deepstone-backend/target/scala-*/scoverage-report/scoverage.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — type check (Svelte / TypeScript)
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The art and audio of the game live in a private repo, never in this one (see README.md).
      - name: No third-party art or audio committed
        run: |
          tracked=$(git ls-files frontend/public/sprites frontend/public/audio)
          if [ -n "$tracked" ]; then
            echo "These files must not be committed, third-party assets stay in the private assets repo:"
            echo "$tracked" | head -20
            exit 1
          fi

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Unit/component tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # E2E — a full run through a real browser against real dev servers (backend
  # + frontend, both started by Playwright's webServer config). Not run on
  # every PR: needs a JVM backend and a browser, too slow/heavy for per-PR
  # feedback - only on push to main and on-demand.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install sbt
        uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('deepstone-backend/build.sbt', 'deepstone-backend/project/*.sbt') }}
          restore-keys: sbt-

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # SonarCloud — static analysis (runs after backend/frontend complete)
  # ─────────────────────────────────────────────────────────────────────────
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Fetch full history so SonarCloud can compute blame and new code metrics
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache sbt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('deepstone-backend/build.sbt', 'deepstone-backend/project/*.sbt') }}
          restore-keys: sbt-

      - name: Download backend coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-coverage
          path: deepstone-backend/target
        continue-on-error: true

      - name: Download frontend coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided automatically by GitHub
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}    # add this in repo Settings → Secrets
